
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">

<title>a bouquet for ganda ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0a0a0a;
    overflow: hidden;
    font-family: Georgia, serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#restart {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 182, 217, .15);
    border: 1px solid #ffb6d9;
    color: #ffb6d9;
    border-radius: 25px;
    padding: 10px 22px;
    font-size: 13px;
    cursor: pointer;
    font-family: Georgia, serif;
    opacity: 0;
    transition: opacity .5s;
}

#restart.visible {
    opacity: 1;
}
</style>
</head>

<body>

<canvas id="bouquet"></canvas>

<button id="restart" onclick="restartAnimation()">
    replay bouquet ♡
</button>

<script>
const canvas = document.getElementById("bouquet");
const ctx = canvas.getContext("2d");

let scale = 1;
let startTime = null;
let animationFrame;
let finished = false;

const shades = [
    ["#C71585", "#FF69B4", "#FFB6C1"],
    ["#8B008B", "#FF1493", "#FF85C1"],
    ["#DB7093", "#FFC0CB", "#FFE4E1"],
    ["#D946A6", "#FF5EC7", "#FFA8E0"]
];

const flowers = [
    [0, 200, 22, 2, 90],
    [-80, 160, 24, 1, 105],
    [80, 160, 24, 0, 75],
    [-130, 90, 27, 3, 115],
    [130, 90, 27, 2, 65],
    [-50, 70, 30, 1, 95],
    [50, 70, 30, 1, 85],
    [-100, 30, 26, 0, 100],
    [100, 30, 26, 2, 80],
    [0, 20, 34, 3, 90]
];

const sparklePositions = [
    [-200, 150],
    [200, 150],
    [-150, 250],
    [150, 250],
    [0, 350]
];

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    scale = Math.min(
        window.innerWidth / 900,
        window.innerHeight / 750
    ) * dpr;
}

window.addEventListener("resize", resize);
resize();

function setupCoordinates() {
    ctx.setTransform(
        scale, 0,
        0, -scale,
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}

function line(x1, y1, x2, y2, color, width) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);

    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
}

function drawStem(x, y, progress) {
    const endX = x * progress;
    const endY = -280 + (y + 280) * progress;

    line(0, -280, endX, endY, "#1B4D1B", 8);
    line(2, -280, endX + 2, endY, "#45a045", 3);
}

function drawLeaf(x, y, angle, size, progress = 1) {
    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(angle * Math.PI / 180);
    ctx.scale(progress, progress);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(
        size * .9, size * .3,
        size * .9, size * 1.1,
        0, size * 1.3
    );
    ctx.bezierCurveTo(
        -size * .5, size * .9,
        -size * .4, size * .3,
        0, 0
    );

    ctx.fillStyle = "#228B22";
    ctx.fill();
    ctx.strokeStyle = "#004400";
    ctx.lineWidth = 2;
    ctx.stroke();

    line(0, 0, 0, size * 1.2, "#90EE90", 1);

    ctx.restore();
}

function drawPetal(size, colors, angle, highlight = true) {
    const [shadow, base, light] = colors;

    ctx.save();
    ctx.rotate(angle * Math.PI / 180);

    ctx.beginPath();
    ctx.moveTo(0, 0);

    ctx.bezierCurveTo(
        -size * .95, size * .65,
        -size * .65, size * 1.7,
        0, size * 1.8
    );

    ctx.bezierCurveTo(
        size * .65, size * 1.7,
        size * .95, size * .65,
        0, 0
    );

    ctx.fillStyle = base;
    ctx.fill();

    ctx.strokeStyle = shadow;
    ctx.lineWidth = 2;
    ctx.stroke();

    if (highlight) {
        ctx.beginPath();
        ctx.moveTo(0, size * .35);
        ctx.quadraticCurveTo(
            size * .35, size * .9,
            size * .1, size * 1.35
        );

        ctx.strokeStyle = light;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.restore();
}

function drawTulip(x, y, size, colors, angle, progress) {
    ctx.save();

    ctx.translate(x, y);
    ctx.scale(progress, progress);
    ctx.rotate(angle * Math.PI / 180);

    // Three main petals
    drawPetal(size, colors, -30);
    drawPetal(size, colors, 30);
    drawPetal(size * .95, colors, 0);

    // Center petal
    ctx.beginPath();
    ctx.arc(0, 0, size * .15, 0, Math.PI * 2);
    ctx.fillStyle = "#FFD700";
    ctx.fill();

    ctx.restore();
}

function drawRibbonWrap() {
    // Pink ribbon
    line(-65, -240, 65, -240, "#FFB6D9", 30);
    line(-65, -232, 65, -232, "#FFDDF4", 8);
}

function drawBow() {
    const pink = "#FFB6D9";
    const shadow = "#FF85C1";

    ctx.save();
    ctx.translate(0, -240);

    // Bow tails
    ctx.fillStyle = pink;
    ctx.strokeStyle = shadow;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(-12, 0);
    ctx.lineTo(-90, 48);
    ctx.lineTo(-78, -18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(90, 48);
    ctx.lineTo(78, -18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Bow loops
    ctx.beginPath();
    ctx.ellipse(-37, 8, 42, 19, .55, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(37, 8, 42, 19, -.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Center knot
    ctx.beginPath();
    ctx.roundRect(-20, -12, 40, 32, 12);
    ctx.fillStyle = "#F3B4C6";
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

function drawSparkles(progress, time) {
    sparklePositions.forEach(([x, y], index) => {
        const pulse = .6 + .4 * Math.sin(time * 3 + index);

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(progress * pulse, progress * pulse);

        ctx.strokeStyle = "#FFD700";
        ctx.lineWidth = 2.5;
        ctx.shadowColor = "#FFD700";
        ctx.shadowBlur = 12;

        for (let angle = 0; angle < 360; angle += 72) {
            ctx.save();
            ctx.rotate(angle * Math.PI / 180);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(8, 0);
            ctx.stroke();

            ctx.restore();
        }

        ctx.restore();
    });
}

function drawText(time) {
    ctx.save();

    // Keep text upright despite the flipped drawing coordinates.
    ctx.scale(1, -1);

    ctx.textAlign = "center";
    ctx.shadowColor = "#FF69B4";
    ctx.shadowBlur = 12;

    ctx.fillStyle = "#FFB6D9";
    ctx.font = "italic 28px Georgia";

    ctx.fillText(
        "Hand-Tied Pink Bouquet",
        0, -360
    );

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#FFB6D9";
    ctx.font = "bold 23px Georgia";

    ctx.fillText("for ganda ♡", 0, 390);

    ctx.fillStyle = "#E8B8CA";
    ctx.font = "italic 15px Georgia";

    ctx.fillText(
        "just because you deserve beautiful things.",
        0, 420
    );

    ctx.restore();
}

function ease(value) {
    value = Math.max(0, Math.min(1, value));
    return 1 - Math.pow(1 - value, 3);
}

function render(timestamp) {
    if (!startTime) startTime = timestamp;

    const elapsed = (timestamp - startTime) / 1000;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    setupCoordinates();

    // 1. Stems: 0 - 4 seconds
    flowers.forEach((f, i) => {
        const progress = ease((elapsed - i * .4) / .4);
        if (progress > 0) {
            drawStem(f[0], f[1], progress);
        }
    });

    // 2. Leaves: 4 - 7.5 seconds
    flowers.forEach((f, i) => {
        if (Math.abs(f[0]) > 40) {
            const progress = ease(
                (elapsed - 4 - i * .5) / .5
            );

            if (progress > 0) {
                drawLeaf(
                    f[0] * .5,
                    f[1] * .5 - 120,
                    f[4] + 35,
                    60,
                    progress
                );
            }
        }
    });

    // 3. Ribbon and bow: 7.5 - 9 seconds
    if (elapsed > 7.5) {
        const ribbonProgress = ease((elapsed - 7.5) / .5);

        ctx.save();
        ctx.globalAlpha = ribbonProgress;
        drawRibbonWrap();
        ctx.restore();
    }

    if (elapsed > 8) {
        const bowProgress = ease((elapsed - 8) / 1);
        ctx.save();
        ctx.globalAlpha = bowProgress;
        drawBow();
        ctx.restore();
    }

    // 4. Tulips: 9 - 24 seconds
    flowers.forEach((f, i) => {
        const progress = ease(
            (elapsed - 9 - i * 1.5) / .9
        );

        if (progress > 0) {
            drawTulip(
                f[0],
                f[1],
                f[2],
                shades[f[3]],
                f[4],
                progress
            );
        }
    });

    // 5. Sparkles: 24 - 26 seconds
    if (elapsed > 24) {
        drawSparkles(
            ease((elapsed - 24) / 1),
            elapsed
        );
    }

    // 6. Final title
    if (elapsed > 25) {
        ctx.save();
        ctx.globalAlpha = ease((elapsed - 25) / 1.5);
        drawText(elapsed);
        ctx.restore();
    }

    if (elapsed >= 27) {
        finished = true;
        document.getElementById("restart")
            .classList.add("visible");
    }

    animationFrame = requestAnimationFrame(render);
}

function restartAnimation() {
    cancelAnimationFrame(animationFrame);

    startTime = null;
    finished = false;

    document.getElementById("restart")
        .classList.remove("visible");

    render(performance.now());
}

// Start automatically when the webpage opens
render(performance.now());

</script>

</body>
</html>
